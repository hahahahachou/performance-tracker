<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#f5f3ff,#eff6ff);min-height:100vh;color:#1f2937}
.container{max-width:1280px;margin:0 auto;padding:2rem 1rem}

.tab-content{display:none;background:#fff;border-radius:0 .75rem .75rem .75rem;box-shadow:0 4px 6px rgba(0,0,0,.05);padding:1rem 1.5rem}
.tab-content.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.5rem}

.stat-card{border-radius:.75rem;padding:1rem;text-align:center}
.stat-card.purple{background:#f5f3ff}.stat-card.blue{background:#eff6ff}
.stat-card.green{background:#f0fdf4}.stat-card.orange{background:#fff7ed}
.stat-value{font-size:1.5rem;font-weight:700}
.stat-value.purple{color:#7c3aed}.stat-value.blue{color:#2563eb}
.stat-value.green{color:#16a34a}.stat-value.orange{color:#ea580c}
.stat-label{font-size:.75rem;color:#6b7280;margin-top:.25rem}
.chart-container{background:#f9fafb;border-radius:.75rem;padding:1rem 1.5rem;margin-bottom:1.5rem}
.chart-container h2{font-size:1.125rem;font-weight:600;margin-bottom:1rem}
.chart-wrapper{position:relative;height:280px}
.group-card{background:#fff;border:1px solid #f3f4f6;border-radius:1rem;padding:1rem 1.25rem;margin-bottom:1rem}
.group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem}
.group-title{display:flex;align-items:center;gap:.75rem}
.group-icon{width:2.5rem;height:2.5rem;border-radius:50%;background:#f3e8ff;display:flex;align-items:center;justify-content:center;font-size:1.125rem;font-weight:700;color:#7c3aed;flex-shrink:0}
.group-name{font-size:1rem;font-weight:700;color:#1f2937}
.group-progress{display:flex;align-items:center;gap:.5rem}
.progress-value{font-size:1.5rem;font-weight:700}
.progress-value.high{color:#16a34a}.progress-value.mid{color:#2563eb}.progress-value.low{color:#7c3aed}
.update-btn{font-size:.75rem;background:#f3e8ff;color:#7c3aed;padding:.375rem .75rem;border-radius:.5rem;font-weight:600;cursor:pointer;border:0}
.progress-bar-container{width:100%;height:.625rem;background:#f3f4f6;border-radius:9999px;margin-bottom:1rem}
.progress-bar{height:100%;border-radius:9999px;transition:width .5s}
.progress-bar.high{background:#16a34a}.progress-bar.mid{background:#2563eb}.progress-bar.low{background:#7c3aed}
.group-body{display:grid;gap:1rem}
@media(min-width:768px){.group-body{grid-template-columns:1fr 1fr}}
.todo-section{background:#f9fafb;border-radius:.75rem;padding:1rem}
.note-section{background:#fffbeb;border-radius:.75rem;padding:1rem}
.section-label{font-size:.8125rem;font-weight:600;color:#6b7280;display:flex;align-items:center;gap:.375rem;margin-bottom:.5rem;flex-wrap:wrap}
.section-label .count{font-size:.6875rem;background:#e9d5ff;color:#7c3aed;padding:.125rem .375rem;border-radius:9999px}
.section-label .count.amber{background:#fef3c7;color:#d97706}
.todo-list{margin-bottom:.75rem}
.todo-item{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem;border-radius:.5rem}
.todo-item:hover{background:#f3f4f6}
.todo-done span{color:#9ca3af;text-decoration:line-through}
.todo-checkbox{width:1.125rem;height:1.125rem;accent-color:#7c3aed;cursor:pointer;flex-shrink:0}
.todo-text{flex:1;font-size:.875rem;word-break:break-word}
.week-tag{font-size:.6875rem;padding:.125rem .5rem;border-radius:.25rem;font-weight:600;white-space:nowrap;flex-shrink:0}
.week-tag.w4{background:#dbeafe;color:#1d4ed8}.week-tag.w5{background:#dcfce7;color:#15803d}
.week-tag.w6{background:#fef9c3;color:#a16207}.week-tag.w8{background:#ffedd5;color:#c2410c}
.week-tag.w9{background:#fee2e2;color:#b91c1c}.week-tag.w10{background:#f3e8ff;color:#7c3aed}
.week-tag.w11{background:#fce7f3;color:#be185d}.week-tag.w12{background:#e0e7ff;color:#4338ca}
.delete-btn{color:#d1d5db;cursor:pointer;font-size:1rem;line-height:1;flex-shrink:0;padding:0 .25rem}
.delete-btn:hover{color:#ef4444}
.add-todo{display:flex;gap:.5rem}
.inline-input{font-size:.8125rem;padding:.375rem .625rem;border:1.5px dashed #d1d5db;border-radius:.5rem;outline:0;flex:1}
.inline-input:focus{border-color:#7c3aed;border-style:solid}
.priority-select{font-size:.75rem;border:1px solid #d1d5db;border-radius:.5rem;padding:.25rem .5rem;background:#fff}
.note-list{margin-bottom:.75rem}
.note-item{border-left:3px solid #f59e0b;padding-left:.75rem;padding:.25rem 0}
.note-item-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.note-text{font-size:.875rem;color:#374151;flex:1;word-break:break-word}
.inline-textarea{font-size:.8125rem;padding:.375rem .625rem;border:1.5px dashed #fbbf24;border-radius:.5rem;outline:0;width:100%;resize:none;font-family:inherit}
.inline-textarea:focus{border-color:#f59e0b;border-style:solid}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:#f9fafb;text-align:left;padding:.75rem 1rem;font-weight:600;color:#374151;font-size:.75rem;border-bottom:1px solid #e5e7eb}
td{padding:.75rem 1rem;border-bottom:1px solid #f3f4f6}
td:first-child{font-weight:600;color:#7c3aed}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:1rem;padding:1.5rem;width:100%;max-width:20rem}
.modal-title{font-size:1.125rem;font-weight:700;margin-bottom:1rem}
.modal-slider{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.slider-input{flex:1;accent-color:#7c3aed}
.slider-value{font-size:1.5rem;font-weight:700;color:#7c3aed;width:4rem;text-align:right}
.modal-actions{display:flex;gap:.5rem}
.btn{flex:1;padding:.5rem;border-radius:.5rem;font-weight:600;cursor:pointer;border:0;font-size:.9rem}
.btn-cancel{background:#f3f4f6;color:#6b7280}
.btn-confirm{background:#7c3aed;color:#fff}
.save-hint{text-align:center;margin-top:1rem;padding:.75rem;background:#f0fdf4;border-radius:.5rem;font-size:.8rem;color:#16a34a}
</style>
</head>

": []}, {"id": 8, "name": "宣传组", "progress": 0, "todos": [{"id": 27, "text": "宣传视觉体系（主视觉、海报、推文模板）定稿", "priority": "normal", "week": "第十一周", "done": false, "created_at": "2026-09-03T00:00:00.000Z"}, {"id": 28, "text": "宣传预热活动方案以及大致预算费用", "priority": "normal", "week": "第十一周", "done": false, "created_at": "2026-09-03T00:00:00.000Z"}, {"id": 29, "text": "反馈剧组排练进度", "priority": "normal", "week": "第十一周", "done": false, "created_at": "2026-09-03T00:00:00.000Z"}], "notes": []}, {"id": 9, "name": "财务组", "progress": 0, "todos": [], "notes": []}, {"id": 10, "name": "演员", "progress": 0, "todos": [], "notes": []}, {"id": 11, "name": "后勤部", "progress": 0, "todos": [], "notes": []}]};

var chart=null,currentGroupId=null;
var schedule=[
{week:'第四周',tasks:'舞台美术设计方案定稿；结合场地测量制作方案',groups:'舞美和道具设计组'},
{week:'第五周',tasks:'服装设计方案定稿；结合演员身形试装与尺寸记录',groups:'服化组'},

];

// 从 localStorage 恢复修改
try{
var saved=localStorage.getItem('tracker_data');
if(saved){
var s=JSON.parse(saved);
if(s&&s.groups){
for(var i=0;i<s.groups.length;i++){
for(var j=0;j<groups.length;j++){
if(groups[j].id===s.groups[i].id){
if(s.groups[i].progress!==undefined)groups[j].progress=s.groups[i].progress;

}}}}}}catch(e){}

function saveLocal(){try{localStorage.setItem('tracker_data',JSON.stringify({groups:groups}))}catch(e){}}

function escHtml(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s||''));return d.innerHTML}

function renderStats(){
var t=groups.length,a=t>0?Math.round(groups.reduce(function(s,g){return s+g.progress},0)/t):0;

document.getElementById('avgProgress').textContent=a+'%';

}

function renderGroups(){
var html='';
for(var i=0;i<groups.length;i++){
var g=groups[i],pt=g.todos.filter(function(t){return !t.done});
var todoHtml='';
for(var j=0;j<g.todos.length;j++){

html+='<div class="group-progress"><span class="progress-value '+pC+'">'+g.progress+'%</span><button class="update-btn" onclick="openModal('+g.id+')">更新</button></div></div>';
html+='<div class="progress-bar-container"><div class="progress-bar '+pC+'" style="width:'+g.progress+'%"></div></div>';
html+='<div class="group-body"><div class="todo-section"><div class="section-label">&#x1F4CB; 待办事项'+(pt.length>0?'<span class="count">'+pt.length+'</span>':'')+'</div>';
html+='<div class="todo-list">'+todoHtml+'</div>';
html+='<div class="add-todo"><input type="text" id="todo-input-'+g.id+'" class="inline-input" placeholder="添加待办，按回车" onkeypress="if(event.key==='Enter')onAddTodo('+g.id+')"><select id="todo-priority-'+g.id+'" class="priority-select"><option value="normal">普通</option><option value="high">紧急</option></select></div></div>';
html+='<div class="note-section"><div class="section-label">&#x1F4DD; 备注/注意事项'+(notes.length>0?'<span class="count amber">'+notes.length+'</span>':'')+'</div>';
html+='<div class="note-list">'+noteHtml+'</div>';
html+='<div><textarea id="note-input-'+g.id+'" class="inline-textarea" rows="2" placeholder="添加备注，Ctrl+回车" onkeydown="if(event.ctrlKey&&event.key==='Enter')onAddNote('+g.id+')"></textarea></div></div></div></div>';
}
document.getElementById('groupsContainer').innerHTML=html;
}

function renderSchedule(){
var html='';for(var i=0;i<schedule.length;i++){var s=schedule[i];
html+='<tr><td>'+s.week+'</td><td>'+s.tasks+'</td><td>'+s.groups+'</td></tr>';}
document.getElementById('scheduleBody').innerHTML=html;
}

function render(){renderGroups();renderStats()}

function openModal(id){
currentGroupId=id;
for(var i=0;i<groups.length;i++){if(groups[i].id===id){
document.getElementById('modalTitle').textContent='更新: '+groups[i].name;
document.getElementById('progressSlider').value=groups[i].progress;
document.getElementById('progressValue').textContent=groups[i].progress+'%';break;
}}
document.getElementById('updateModal').classList.add('show');
}
function closeModal(){document.getElementById('updateModal').classList.remove('show')}

function submitUpdate(){
var p=parseInt(document.getElementById('progressSlider').value);
for(var i=0;i<groups.length;i++){if(groups[i].id===currentGroupId){groups[i].progress=p;break}}
closeModal();render();updateChart();saveLocal();
}

function onToggleTodo(gid,tid){
for(var i=0;i<groups.length;i++){if(groups[i].id!==gid)continue;
for(var j=0;j<groups[i].todos.length;j++){if(groups[i].todos[j].id===tid){groups[i].todos[j].done=!groups[i].todos[j].done;render();updateChart();saveLocal();return}}}
}
function onAddTodo(gid){
var inp=document.getElementById('todo-input-'+gid),text=inp.value.trim();if(!text)return;
var pr=document.getElementById('todo-priority-'+gid).value;
for(var i=0;i<groups.length;i++){if(groups[i].id!==gid)continue;
var maxId=0;for(var j=0;j<groups.length;j++)for(var k=0;k<groups[j].todos.length;k++)if(groups[j].todos[k].id>maxId)maxId=groups[j].todos[k].id;
groups[i].todos.push({id:maxId+1,text:text,priority:pr,week:'',done:false,created_at:new Date().toISOString()});
inp.value='';render();updateChart();saveLocal();return;}
}
function onDeleteTodo(gid,tid){
if(!confirm('确认删除？'))return;
for(var i=0;i<groups.length;i++){if(groups[i].id!==gid)continue;
groups[i].todos=groups[i].todos.filter(function(t){return t.id!==tid});render();updateChart();saveLocal();return;}
}
function onAddNote(gid){
var inp=document.getElementById('note-input-'+gid),text=inp.value.trim();if(!text)return;
for(var i=0;i<groups.length;i++){if(groups[i].id!==gid)continue;
if(!groups[i].notes)groups[i].notes=[];var maxId=0;
for(var j=0;j<groups.length;j++){var ns=groups[j].notes||[];for(var k=0;k<ns.length;k++)if(ns[k].id>maxId)maxId=ns[k].id}
groups[i].notes.push({id:maxId+1,text:text,created_at:new Date().toISOString()});
inp.value='';render();saveLocal();return;}
}
function onDeleteNote(gid,nid){
if(!confirm('确认删除？'))return;
for(var i=0;i<groups.length;i++){if(groups[i].id!==gid)continue;
if(!groups[i].notes)return;groups[i].notes=groups[i].notes.filter(function(n){return n.id!==nid});render();saveLocal();return;}
}

function loadChartJS(){
var s=document.createElement('script');
s.src='https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
s.onload=createChart;
s.onerror=function(){
// bootcdn也失败，用纯CSS柱状图代替
var wrapper=document.querySelector('.chart-wrapper');
wrapper.innerHTML='<div style="display:flex;align-items:flex-end;gap:4px;height:100%;padding:10px 0">'+groups.map(function(g){
var h=Math.max(g.progress,2);
var color=g.progress>=100?'#16a34a':g.progress>=50?'#2563eb':'#7c3aed';
return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:10px;color:#6b7280">'+g.progress+'%</div><div style="width:100%;height:'+h+'%;background:'+color+';border-radius:4px;min-height:4px"></div><div style="font-size:9px;color:#6b7280;text-align:center;word-break:break-all">'+g.name.substring(0,3)+'</div></div>';
}).join('')+'</div>';
};
document.head.appendChild(s);
}

function createChart(){
chart=new Chart(document.getElementById('progressChart').getContext('2d'),{
type:'bar',data:{labels:groups.map(function(g){return g.name}),datasets:[{label:'进度 (%)',data:groups.map(function(g){return g.progress}),backgroundColor:'rgba(124,58,237,0.8)',borderRadius:6}]},
options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+'%'}}}},plugins:{legend:{display:false}}}}
});
}
function updateChart(){
if(!chart)return;
chart.data.datasets[0].data=groups.map(function(g){return g.progress});
chart.data.datasets[0].backgroundColor=groups.map(function(g){return g.progress===100?'rgba(22,163,74,0.8)':g.progress>=50?'rgba(37,99,235,0.8)':'rgba(124,58,237,0.8)'});
chart.update();
}

function switchTab(tab,el){
var btns=document.querySelectorAll('.tab-btn'),tabs=document.querySelectorAll('.tab-content');
for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
el.classList.add('active');document.getElementById('tab-'+tab).classList.add('active');
}
document.getElementById('progressSlider').addEventListener('input',function(e){document.getElementById('progressValue').textContent=e.target.value+'%'});
document.getElementById('updateModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

render();renderSchedule();loadChartJS();
</script>
</body>
</html>
